[package]
name = "tracetracking"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
dirs = "6"
ignore = "0.4"
notify = "8"
ratatui = "0.29"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled","functions","hooks"] }
sha2 = "0.10"
similar = "2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-java = "0.23"
quick-xml = "0.39"

tree-sitter-highlight = "0.25"
tree-sitter-yaml = "0.7"
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
